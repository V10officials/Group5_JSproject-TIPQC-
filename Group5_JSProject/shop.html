<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | SportsHub</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header id="site-header" class="site-header"></header>

  <main class="wrap">

    <div class="shop-layout">

      <!-- FILTERS -->
      <aside class="filter-panel">

        <h3>Filter By</h3>

        <div class="filter-group">
          <span class="filter-label">Category</span>

          <label class="checkbox-row">
            <input type="checkbox" value="Basketballs" checked>
            <span>Basketballs</span>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" value="Jerseys" checked>
            <span>Jerseys</span>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" value="Shoes" checked>
            <span>Shoes</span>
          </label>

          <label class="checkbox-row">
            <input type="checkbox" value="Sports Gear" checked>
            <span>Sports Gear</span>
          </label>
        </div>

        <!-- PRICE RANGE -->
        <div class="filter-group">

          <span class="filter-label">Price Range</span>

          <div class="price-range">
            <span>$0</span>

            <input
              type="range"
              id="price-range"
              min="0"
              max="200"
              value="200"
            >

            <span id="price-value">$200</span>
          </div>

        </div>

        <button id="clear-filters" class="btn btn-outline btn-block">
          Clear Filters
        </button>

      </aside>


      <!-- SHOP CONTENT -->
      <section>

        <div class="shop-top-row">

          <div class="shop-header">
            <span class="eyebrow">SHOP</span>
            <h1>All Products</h1>
            <p>Gear up and play your best.</p>
          </div>

          <select id="sort-select" class="sort-select">
            <option value="default">Featured</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name">Name</option>
          </select>

        </div>


        <!-- CATEGORY TABS -->
        <div class="tabs">
          <button class="tab-btn active" data-category="All">All</button>
          <button class="tab-btn" data-category="Basketballs">Basketballs</button>
          <button class="tab-btn" data-category="Jerseys">Jerseys</button>
          <button class="tab-btn" data-category="Shoes">Shoes</button>
          <button class="tab-btn" data-category="Sports Gear">Sports Gear</button>
        </div>


        <!-- PRODUCTS -->
        <div id="shop-grid" class="product-grid"></div>

      </section>

    </div>

  </main>


  <footer id="site-footer" class="footer"></footer>


  <script src="script.js"></script>

  <script>

    let selectedCategory = "All";


    /* PRODUCT IMAGES */
    function getShopImage(product) {

      if (product.id === "basketball") return "Basketballs/ball1.png";
      if (product.id === "jersey") return "Jerseys/jersey1.png";
      if (product.id === "shoes") return "Shoes/shoes1.png";
      if (product.id === "gear") return "Gears/gear1.png";

      return "";

    }


    /* RENDER PRODUCTS */
    function renderShop() {

      const grid = document.getElementById("shop-grid");
      const priceRange = document.getElementById("price-range");
      const maxPrice = Number(priceRange.value);


      /* ONLY SHOW THESE 4 PRODUCTS */
      let list = PRODUCTS.filter(product =>
        (
          product.id === "basketball" ||
          product.id === "jersey" ||
          product.id === "shoes" ||
          product.id === "gear"
        )
        && product.price <= maxPrice
      );


      /* CATEGORY FILTER */
      if (selectedCategory !== "All") {
        list = list.filter(product =>
          product.category === selectedCategory
        );
      }


      /* CHECKBOX FILTER */
      const checkedCategories = Array.from(
        document.querySelectorAll('.checkbox-row input:checked')
      ).map(input => input.value);

      if (selectedCategory === "All") {
        list = list.filter(product =>
          checkedCategories.includes(product.category)
        );
      }


      /* SORT */
      const sort = document.getElementById("sort-select").value;

      if (sort === "price-low") {
        list.sort((a, b) => a.price - b.price);
      }

      if (sort === "price-high") {
        list.sort((a, b) => b.price - a.price);
      }

      if (sort === "name") {
        list.sort((a, b) => a.name.localeCompare(b.name));
      }


      /* DISPLAY */
      grid.innerHTML = list.map((product, index) => {

        const image = getShopImage(product);
        const bgClass = index % 2 === 0 ? "bg-a" : "bg-b";

        return `

          <article class="card">

            <a href="product.html?id=${product.id}">

              <div class="card-img ${bgClass}">

                <img
                  src="${image}"
                  alt="${product.name}"
                  class="prod-icon"
                  style="width:100%;height:100%;object-fit:contain;"
                >

              </div>

            </a>

            <button
              type="button"
              class="wish-btn ${isWished(product.id) ? "active" : ""}"
              onclick="toggleWishBtn('${product.id}', this)"
              aria-label="${isWished(product.id) ? "Remove from wishlist" : "Add to wishlist"}"
            >${isWished(product.id) ? "&#9829;" : "&#9825;"}</button>


            <div class="card-body">

              <div class="card-title">
                ${product.name}
              </div>

              <div class="card-footer">

                <span class="price-tag">
                  ${fmt(product.price)}
                </span>

                <button
                  class="add-cart-btn"
                  onclick="addProductToCart('${product.id}', this)"
                >
                  Add to Cart
                </button>

              </div>

            </div>

          </article>

        `;

      }).join("");


      /* EMPTY RESULT */
      if (list.length === 0) {
        grid.innerHTML = `
          <p style="color: var(--text-muted);">
            No products found in this price range.
          </p>
        `;
      }

    }


    /* PRICE SLIDER */
    const priceRange = document.getElementById("price-range");
    const priceValue = document.getElementById("price-value");

    priceRange.addEventListener("input", function () {
      const value = Number(this.value);
      priceValue.textContent = "$" + value;
      renderShop();
    });


    /* CATEGORY CHECKBOXES */
    document
      .querySelectorAll('.checkbox-row input')
      .forEach(input => {
        input.addEventListener("change", renderShop);
      });


    /* CATEGORY TABS */
    document
      .querySelectorAll(".tab-btn")
      .forEach(button => {

        button.addEventListener("click", function () {

          document
            .querySelectorAll(".tab-btn")
            .forEach(btn => btn.classList.remove("active"));

          this.classList.add("active");

          selectedCategory = this.dataset.category;

          renderShop();

        });

      });


    /* SORT */
    document
      .getElementById("sort-select")
      .addEventListener("change", renderShop);


    /* CLEAR FILTERS */
    document
      .getElementById("clear-filters")
      .addEventListener("click", function () {

        document
          .querySelectorAll('.checkbox-row input')
          .forEach(input => { input.checked = true; });

        priceRange.value = 200;
        priceValue.textContent = "$200";

        selectedCategory = "All";

        document
          .querySelectorAll(".tab-btn")
          .forEach(btn => btn.classList.remove("active"));

        document
          .querySelector('.tab-btn[data-category="All"]')
          .classList.add("active");

        document.getElementById("sort-select").value = "default";

        renderShop();

      });


    /* HEADER + FOOTER */
    renderHeader("Shop");
    renderFooter();


    /* INITIAL LOAD */
    renderShop();

  </script>

</body>
</html>
