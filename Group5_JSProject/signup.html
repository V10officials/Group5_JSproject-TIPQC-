<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — SportsHub</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <a href="index.html" class="logo">
          <span class="logo-badge">SH</span>
          <span class="logo-text">Sports<span class="accent">Hub</span></span>
        </a>
        <h1>Create your account</h1>
        <p class="sub">Join SportsHub for faster checkout and order tracking.</p>

        <form id="signup-form">
          <div class="auth-field">
            <label>Full Name</label>
            <input type="text" id="signup-name" placeholder="Enter your name" required>
          </div>
          <div class="auth-field">
            <label>Email</label>
            <input type="email" id="signup-email" placeholder="user@email.com" required>
          </div>
          <div class="auth-field">
            <label>Password</label>
            <input type="password" id="signup-password" placeholder="At least 8 characters" required minlength="8">
          </div>
          <div class="auth-field">
            <label>Confirm Password</label>
            <input type="password" id="signup-confirm" placeholder="Re-enter your password" required minlength="6">
          </div>
          <p class="auth-error" id="signup-error">Passwords must match and be at least 6 characters.</p>
          <button type="submit" class="btn btn-primary btn-block">Sign Up</button>

          <a href="forgotpassword.html" class="btn btn-outline btn-block" style="margin-top:12px;">
            Forgot Password?
          </a>
        </form>

        <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="script.js"></script>
  <script src="function.js"></script>

</body>

</html>
